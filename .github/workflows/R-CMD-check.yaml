# Run R CMD check on Linux (current R release) on every push and PR.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE*'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'man/figures/**'

name: R-CMD-check.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RENV_CONFIG_AUTO_LOAD: FALSE

    steps:
      - uses: actions/checkout@v4

      # Remove the renv autoloader so it does not replace the CI library.
      - name: Disable renv in CI
        run: rm -f renv/activate.R .Rprofile
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
